name: Staging Deployment CI/CD

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,value=${{ github.sha }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH and Deploy to Azure Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 20.198.217.229
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Create project folder if not exists
            mkdir -p ~/pickleyard
            cd ~/pickleyard

            # 2. Write docker-compose.yml file from registry reference
            cat << 'EOF' > docker-compose.yml
            version: '3.8'

            services:
              postgres:
                image: postgres:15-alpine
                container_name: pickleyard-db
                restart: always
                environment:
                  POSTGRES_USER: ${DB_USER:-avenor}
                  POSTGRES_PASSWORD: ${DB_PASSWORD:-avenor_dev_2026}
                  POSTGRES_DB: ${DB_NAME:-paddleyardv2}
                volumes:
                  - postgres_data:/var/lib/postgresql/data
                ports:
                  - "5432:5432"
                deploy:
                  resources:
                    limits:
                      memory: 256M
                healthcheck:
                  test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
                  interval: 10s
                  timeout: 5s
                  retries: 5

              web:
                image: ghcr.io/eisendev/pickleyard:latest
                container_name: pickleyard-web
                restart: always
                ports:
                  - "3000:3000"
                environment:
                  DATABASE_URL: postgresql://${DB_USER:-avenor}:${DB_PASSWORD:-avenor_dev_2026}@postgres:5432/${DB_NAME:-paddleyardv2}?schema=public
                  AUTH_SECRET: ${AUTH_SECRET}
                  NEXTAUTH_URL: ${NEXTAUTH_URL:-https://pickleyard.zeraynce.com}
                  PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY}
                  PAYMONGO_WEBHOOK_SECRET: ${PAYMONGO_WEBHOOK_SECRET}
                  AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
                  AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
                  NODE_OPTIONS: "--max-old-space-size=512"
                deploy:
                  resources:
                    limits:
                      memory: 512M
                depends_on:
                  postgres:
                    condition: service_healthy

            volumes:
              postgres_data:
            EOF

            # 3. Create .env file on VM with environment secrets
            cat << EOF > .env
            DB_USER=avenor
            DB_PASSWORD=avenor_dev_2026
            DB_NAME=paddleyardv2
            AUTH_SECRET="${{ secrets.AUTH_SECRET }}"
            NEXTAUTH_URL="https://pickleyard.zeraynce.com"
            PAYMONGO_SECRET_KEY="${{ secrets.PAYMONGO_SECRET_KEY }}"
            PAYMONGO_WEBHOOK_SECRET="${{ secrets.PAYMONGO_WEBHOOK_SECRET }}"
            AUTH_GOOGLE_ID="${{ secrets.AUTH_GOOGLE_ID }}"
            AUTH_GOOGLE_SECRET="${{ secrets.AUTH_GOOGLE_SECRET }}"
            EOF

            # 4. Log in to GitHub Package Registry on the target server
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 5. Pull, recreate, and run containers
            docker compose pull
            docker compose down
            docker compose up -d

            # 6. Apply database schemas
            docker compose exec -T web npx prisma db push --accept-data-loss
