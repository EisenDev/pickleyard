name: Staging Deployment CI/CD

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,value=${{ github.sha }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH and Deploy to Azure Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 20.198.217.229
          username: azureuser
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 45s
          command_timeout: 10m
          script: |
            # 1. Create project folder if not exists
            mkdir -p ~/pickleyard
            cd ~/pickleyard

            # 2. Write docker-compose.yml file
            cat << 'EOF' > docker-compose.yml
            version: '3.8'

            services:
              web:
                image: ghcr.io/eisendev/pickleyard:latest
                container_name: pickleyard-web
                restart: always
                ports:
                  - "3000:3000"
                environment:
                  DATABASE_URL: ${DATABASE_URL}
                  DIRECT_URL: ${DIRECT_URL}
                  AUTH_SECRET: ${AUTH_SECRET}
                  AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
                  AUTH_URL: ${AUTH_URL}
                  NEXTAUTH_URL: ${NEXTAUTH_URL:-https://pickleyard.zeraynce.com}
                  PAYMONGO_SECRET_KEY: ${PAYMONGO_SECRET_KEY}
                  PAYMONGO_WEBHOOK_SECRET: ${PAYMONGO_WEBHOOK_SECRET}
                  AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID}
                  AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET}
                  NODE_OPTIONS: "--max-old-space-size=512"
                deploy:
                  resources:
                    limits:
                      memory: 512M
            EOF

            # 3. Log in to GitHub Package Registry on the target server
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 4. Pull, recreate, and run container
            docker compose pull
            docker compose down
            docker compose up -d

            # 5. Apply database schemas
            docker compose exec -T web npx prisma@5.22.0 db push --skip-generate --accept-data-loss
